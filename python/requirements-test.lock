# Fully resolved, hash-locked dependency graph for the Python (pytest) test tier.
#
# AAP §0.6.1.1 (the pinned test stack) / §0.5.4 (test configuration) / §0.9.4.1
# (Python is a migration decision: the repository pins no interpreter) /
# §0.11.1 ("evidence over assumption"; "respect the existing freeze where it
# still applies") / tech-spec §6.6.3.4 (the documentation convention).
#
# INVARIANT LOCKED BY THIS FILE: every artifact the Python test tier installs is
# fixed by VERSION and by SHA-256 DIGEST, transitively. python/requirements-test.txt
# pins the 18 DIRECT distributions and documents why each of them is there; this
# file pins those 18 plus the 40 distributions they pull in, and records the
# digest of every artifact each pin may legitimately be satisfied by.
# hack/lib/python.sh installs from THIS file with `pip install --require-hashes`,
# so an artifact that does not match a recorded digest fails the install instead
# of entering the environment.
#
# Exact direct pins alone cannot give that guarantee, which is why this file
# exists alongside the manifest rather than instead of it: 40 of the 58
# distributions below are selected TRANSITIVELY and are named nowhere in the
# manifest, so a fresh resolve could legitimately pick a different transitive
# version - and, without a digest, different bytes under the same version - while
# the manifest and its hash stayed identical. Hash checking is pip's documented
# protection against a tampered or substituted remote artifact, and it requires
# every requirement to be pinned and hashed, which is exactly the shape below.
#
# TWO FILES, ONE SOURCE OF TRUTH. The manifest is the file a human edits; this
# file is generated FROM it and is never hand-edited. Adding, removing or moving
# a pin means editing python/requirements-test.txt and regenerating this file in
# the SAME change - hack/lib/python.sh cross-checks the two and refuses to
# install when a direct pin here disagrees with the manifest.
#
# TO REGENERATE, from the repository root:
#
#   uv pip compile python/requirements-test.txt \
#       --generate-hashes --universal --python-version 3.10 \
#       -o python/requirements-test.lock
#
# Re-running that command is stable: uv preserves the versions already recorded
# here, so regeneration after a manifest edit changes only what the edit
# requires. Pass --upgrade to deliberately re-resolve every transitive.
#
# PLATFORM AND INTERPRETER COVERAGE: --universal, so the resolution is forked
# rather than tied to the machine that produced it. Where a distribution cannot
# serve every supported interpreter, both branches are recorded with the marker
# that selects between them (futurist 3.3.0 below Python 3.11 and 3.4.0 from
# 3.11, for instance), and Windows-only or older-interpreter-only distributions
# (colorama, tomli, exceptiongroup, backports-asyncio-runner) are recorded with
# their markers so the lock stays installable off this platform. Every pin also
# carries the digest of the source distribution as well as of each wheel, so an
# interpreter with no matching wheel builds from a source archive this file has
# already vouched for.
#
# WHAT IS DELIBERATELY NOT HERE: pip itself. It is bootstrapped into the empty
# virtual environment before this file can be read, so hack/lib/python.sh pins
# and digest-verifies that one artifact on its own; and the `wheel` distribution,
# which no pin below requires - it is a virtual-environment seed package, not
# part of this tier's dependency graph.
#
# MEASURED: 58 distributions, 983 recorded artifact digests. Installing this file
# into the environment described by python/requirements-test.txt leaves
# `pip check` reporting "No broken requirements found." and `pip install
# --require-hashes --dry-run -r python/requirements-test.lock` exiting 0 with
# nothing to change.

