# Configuration for the Python (pytest) test tier that ports the Go
# security-regression surface for controls V1-V8.
#
# AAP  §0.4.6 / §0.5.4 (test configuration)  /  tech-spec §6.6.1 (test tiers)
#
# NOTE (pytest 9): the native `[tool.pytest]` table and the legacy
# `[tool.pytest.ini_options]` table MUST NOT both appear in one file.
# This project uses `[tool.pytest.ini_options]` exclusively (AAP §0.2.2.1).

[tool.pytest.ini_options]
minversion = "9.1.1"
testpaths = ["tests"]

# Keep the repository root importable from the test tree so that
# `tests.fixtures.*` / `tests.helpers.*` resolve without install steps.
pythonpath = ["."]
consider_namespace_packages = true

addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--import-mode=importlib",
]

# Marker vocabulary (AAP §0.5.4). `--strict-markers` makes an unknown marker
# an error, so every marker used by a test module must be declared here.
markers = [
  "integration: needs a real etcd 3.6.5 binary and a real kube-apiserver (L2 tier)",
  "shell: invokes the shipped bash generators through a subprocess (L1/L4 tiers)",
  "config: pure decode/assert over committed or generated configuration (L3 tier)",
  "parity: parity-contract meta-assertions against baseline/go_baseline.json",
  "slow: runtime materially above the unit-tier budget",
]

# A hang must become a failure, never a wedged job: this is one half of the
# substitute for Go's `-race` / goleak guarantees (AAP §0.4.1.2).
# Individual integration modules may raise it with @pytest.mark.timeout(...).
timeout = 300
timeout_method = "thread"

# Machine-readable reporting: JUnit XML is emitted by hack/make-rules/test-python.sh
# into ${KUBE_JUNIT_REPORT_DIR}, the same convention gotestsum already honours.
junit_family = "xunit2"
junit_logging = "system-out"
junit_duration_report = "call"

xfail_strict = true
log_cli_level = "INFO"
asyncio_mode = "strict"

[tool.coverage.run]
branch = true
parallel = true
source = ["tests"]
omit = [
  # The logic under test in the shell tiers is Bash; Python line coverage of a
  # subprocess wrapper is not a meaningful signal (AAP §0.7.1.3: measured, not gated).
  "tests/unit/shell/*",
  "tests/parity/tools/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.coverage.xml]
output = "coverage.xml"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "PT"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
ignore_missing_imports = true
exclude = ['^\.venv/']
